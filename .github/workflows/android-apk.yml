name: Build Together Ledger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "mobile/**"
      - "package.json"
      - "*.tar.gz"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

env:
  NODE_VERSION: "22.x"
  EXPO_PUBLIC_APP_ID: "HDBmsjkFmtXoV2nyYfgboo"
  EXPO_PUBLIC_OAUTH_PORTAL_URL: "https://manus.im"
  EXPO_PUBLIC_API_BASE_URL: "https://togetherapp-hdbmsjkf.manus.space"
  EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
  EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
  EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Verify Firebase client configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_FIREBASE_API_KEY"
          test -n "$EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN"
          test -n "$EXPO_PUBLIC_FIREBASE_PROJECT_ID"
          test -n "$EXPO_PUBLIC_FIREBASE_APP_ID"

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          VERSION="$(grep -m1 '"version"' mobile/app.json | sed -E 's/.*"version": "([^"]+)".*/\1/')"
          VERSION_CODE="$(grep -m1 '"versionCode"' mobile/app.json | sed -E 's/.*"versionCode": ([0-9]+).*/\1/')"
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Generate native Android project
        working-directory: mobile
        run: pnpm run prebuild:android

      - name: Create CI debug keystore for release validation
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -noprompt \
              -keystore app/debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f app/debug.keystore

      - name: Prepare stable Android release signing
        working-directory: mobile
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/together-ledger-release.jks
          test -s android/app/together-ledger-release.jks
          keytool -list -keystore android/app/together-ledger-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          cat > android/ci-release-signing.gradle <<'GRADLE'
          gradle.beforeProject { project ->
            if (project.path == ":app") {
              project.afterEvaluate {
                def androidExtension = project.extensions.findByName("android")
                if (androidExtension == null) {
                  throw new GradleException("Android extension was not found for :app")
                }
                def signingConfig = androidExtension.signingConfigs.findByName("ciRelease") ?: androidExtension.signingConfigs.create("ciRelease")
                signingConfig.storeFile = project.file("together-ledger-release.jks")
                signingConfig.storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                signingConfig.keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                signingConfig.keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                androidExtension.buildTypes.getByName("release").signingConfig = signingConfig
              }
            }
          }
          GRADLE

      - name: Build standalone release APK with embedded JavaScript bundle
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -I ci-release-signing.gradle assembleRelease

      - name: Verify embedded JavaScript bundle and APK version
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E 'assets/index\.android\.bundle|assets/.*\.bundle' >/dev/null
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "versionName='${{ steps.app-version.outputs.version }}'" >/dev/null
          "$AAPT" dump badging "$APK" | grep -F "versionCode='${{ steps.app-version.outputs.version_code }}'" >/dev/null
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK" >/dev/null
          "$APKSIGNER" verify --print-certs "$APK" | grep -F "certificate SHA-256 digest" >/dev/null
          cp "$APK" "app/build/outputs/apk/release/together-ledger.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: together-ledger-${{ steps.app-version.outputs.version }}-release-apk
          path: mobile/android/app/build/outputs/apk/release/together-ledger.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create APK checksum file
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/android/app/build/outputs/apk/release/together-ledger.apk"
          sha256sum "$APK" > mobile/android/app/build/outputs/apk/release/together-ledger.apk.sha256

      - name: Publish APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.app-version.outputs.version }}
          APK_PATH: mobile/android/app/build/outputs/apk/release/together-ledger.apk
          CHECKSUM_PATH: mobile/android/app/build/outputs/apk/release/together-ledger.apk.sha256
        run: |
          set -euo pipefail
          retry_gh() {
            local attempt=1 max_attempts=5 delay=5
            until gh "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "GitHub Release command failed after ${max_attempts} attempts: gh $*" >&2
                return 1
              fi
              echo "GitHub API temporarily unavailable; retrying in ${delay}s (attempt ${attempt}/${max_attempts})." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          if retry_gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $TAG_NAME already exists."
          elif retry_gh release create "$TAG_NAME" --title "Together Ledger $TAG_NAME" --notes-file "mobile/RELEASE_NOTES_${TAG_NAME}.md"; then
            echo "Created GitHub Release $TAG_NAME."
          else
            retry_gh release view "$TAG_NAME" >/dev/null
          fi
          retry_gh release upload "$TAG_NAME" "$APK_PATH" "$CHECKSUM_PATH" --clobber

      - name: Write build summary
        shell: bash
        run: |
          APK="mobile/android/app/build/outputs/apk/release/together-ledger.apk"
          {
            echo "## Together Ledger Android APK"
            echo ""
            echo "- Version: ${{ steps.app-version.outputs.version }}"
            echo "- Version code: ${{ steps.app-version.outputs.version_code }}"
            echo "- Build type: standalone release APK (fixed release signing)"
            echo "- Embedded bundle: verified"
            echo "- Release signing: fixed GitHub Secrets keystore verified"
            echo "- Artifact: together-ledger-${{ steps.app-version.outputs.version }}-release-apk"
            echo "- Download filename: together-ledger.apk"
            echo "- GitHub Release: v${{ steps.app-version.outputs.version }}"
            echo "- SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            echo "- Size: $(stat -c '%s bytes' "$APK")"
          } >> "$GITHUB_STEP_SUMMARY"
