name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

env:
  NODE_VERSION: "22.x"
  PNPM_VERSION: "11.21.0"
  EXPO_PUBLIC_APP_ID: "HDBmsjkFmtXoV2nyYfgboo"
  EXPO_PUBLIC_OAUTH_PORTAL_URL: "https://manus.im"
  EXPO_PUBLIC_API_BASE_URL: "https://togetherapp-hdbmsjkf.manus.space"

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          VERSION="$(grep -m1 '"version"' mobile/app.json | sed -E 's/.*"version": "([^"]+)".*/\1/')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate native Android project
        working-directory: mobile
        run: pnpm run prebuild:android

      - name: Build standalone release APK with embedded JavaScript bundle
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify embedded JavaScript bundle and APK version
        working-directory: mobile/android
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E 'assets/index\.android\.bundle|assets/.*\.bundle' >/dev/null
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "versionName='1.2.0'" >/dev/null
          echo "Release APK contains the embedded JavaScript bundle and versionName=1.2.0."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: together-ledger-${{ steps.app-version.outputs.version }}-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        shell: bash
        run: |
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          {
            echo "## Together Ledger Android APK"
            echo ""
            echo "- Version: ${{ steps.app-version.outputs.version }}"
            echo "- Build type: standalone release APK (debug-signed for testing)"
            echo "- Artifact: together-ledger-${{ steps.app-version.outputs.version }}-release-apk"
            echo "- SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            echo "- Size: $(stat -c '%s bytes' "$APK")"
          } >> "$GITHUB_STEP_SUMMARY"
