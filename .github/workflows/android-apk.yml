name: Android APK



on:

  workflow_dispatch:
  
  push:
  
    branches:
    
      - main
      
    paths:
    
      - "together-ledger-v1.2.0-source.tar.gz"
      
      - ".github/workflows/android-apk.yml"
      


permissions:

  contents: read
  


env:

  NODE_VERSION: "22.x"
  
  PNPM_VERSION: "11.21.0"
  
  EXPO_PUBLIC_APP_ID: "HDBmsjkFmtXoV2nyYfgboo"
  
  EXPO_PUBLIC_OAUTH_PORTAL_URL: "https://manus.im"
  
  EXPO_PUBLIC_API_BASE_URL: "https://togetherapp-hdbmsjkf.manus.space"
  


jobs:

  build-android-apk:
  
    name: Build Android APK
    
    runs-on: ubuntu-24.04
    
    timeout-minutes: 35
    


    steps:
    
      - name: Checkout repository
      
        uses: actions/checkout@v4
        


      - name: Extract v1.2.0 source archive
      
        shell: bash
        
        run: |
        
          rm -rf source
          
          mkdir -p source
          
          tar -xzf together-ledger-v1.2.0-source.tar.gz -C source
          
          test -f source/mobile/app.json
          
          test -f source/mobile/package.json
          
          test -f source/mobile/pnpm-lock.yaml
          


      - name: Setup pnpm
      
        uses: pnpm/action-setup@v4
        
        with:
        
          version: ${{ env.PNPM_VERSION }}
          


      - name: Setup Node.js
      
        uses: actions/setup-node@v4
        
        with:
        
          node-version: ${{ env.NODE_VERSION }}
          
          cache: pnpm
          
          cache-dependency-path: source/mobile/pnpm-lock.yaml
          


      - name: Setup Java
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: "17"
          


      - name: Setup Android SDK
      
        uses: android-actions/setup-android@v3
        


      - name: Install Android SDK components
      
        shell: bash
        
        run: |
        
          yes | sdkmanager --licenses >/dev/null || true
          
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          


      - name: Install JavaScript dependencies
      
        working-directory: source/mobile
        
        run: pnpm install --frozen-lockfile
        


      - name: Read app version
      
        id: app-version
        
        shell: bash
        
        run: |
        
          VERSION="$(node -p "require('./source/mobile/app.json').expo.version")"
          
          test "$VERSION" = "1.2.0"
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          


      - name: Generate native Android project
      
        working-directory: source/mobile
        
        run: pnpm run prebuild:android
        


      - name: Build debug APK with Gradle
      
        working-directory: source/mobile/android
        
        run: |
        
          chmod +x ./gradlew
          
          ./gradlew --no-daemon --stacktrace assembleDebug
          


      - name: Upload APK artifact
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: together-ledger-${{ steps.app-version.outputs.version }}-debug-apk
          
          path: source/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          
          if-no-files-found: error
          
          retention-days: 14
          


      - name: Write build summary
      
        shell: bash
        
        run: |
        
          APK="source/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          
          {
          
            echo "## Together Ledger Android APK"
            
            echo ""
            
            echo "- Version: ${{ steps.app-version.outputs.version }}"
            
            echo "- Build type: debug-signed APK"
            
            echo "- Artifact: together-ledger-${{ steps.app-version.outputs.version }}-debug-apk"
            
            echo "- SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            
    






















































































