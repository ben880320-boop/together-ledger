name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "*.tar.gz"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore mobile source from release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f -name '*release-source*.tar.gz' -print -quit)"
          if [ -z "$archive" ]; then
            test -f mobile/pnpm-lock.yaml
            exit 0
          fi
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          tar -xzf "$archive" -C "$temp_dir" --strip-components=1
          test -f "$temp_dir/mobile/pnpm-lock.yaml"
          rm -rf mobile
          cp -a "$temp_dir/mobile" mobile

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        working-directory: mobile
        run: pnpm run prebuild:android

      - name: Create CI debug keystore for release validation
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -noprompt -keystore app/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f app/debug.keystore

      - name: Build standalone release APK with embedded JavaScript bundle
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify embedded JavaScript bundle and APK version
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E 'assets/index\.android\.bundle|assets/.*\.bundle' >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "versionName='1.2.0'" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "versionCode='2'" >/dev/null
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: together-ledger-1.2.0-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
